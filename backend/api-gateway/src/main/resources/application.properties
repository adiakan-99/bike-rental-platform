server.port=8080
spring.application.name=api-gateway

# ==========================
# Gateway Routes (Business APIs)
# ==========================

spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=http://auth-service:8081
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/auth/**

spring.cloud.gateway.server.webflux.routes[1].id=customer-service
spring.cloud.gateway.server.webflux.routes[1].uri=http://customer-service:8082
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/v1/customers/**

spring.cloud.gateway.server.webflux.routes[2].id=partner-service
spring.cloud.gateway.server.webflux.routes[2].uri=http://partner-service:8083
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/v1/partners/**

# ==========================
# Swagger Routes (OpenAPI Specs)
# ==========================

# Auth Service API Docs
spring.cloud.gateway.server.webflux.routes[3].id=auth-swagger
spring.cloud.gateway.server.webflux.routes[3].uri=http://auth-service:8081
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/auth/v3/api-docs
spring.cloud.gateway.server.webflux.routes[3].filters[0]=RewritePath=/auth(?<segment>/?.*), $\{segment}

# Customer Service API Docs
spring.cloud.gateway.server.webflux.routes[4].id=customer-swagger
spring.cloud.gateway.server.webflux.routes[4].uri=http://customer-service:8082
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/customer/v3/api-docs
spring.cloud.gateway.server.webflux.routes[4].filters[0]=RewritePath=/customer(?<segment>/?.*), $\{segment}

# Partner Service API Docs
spring.cloud.gateway.server.webflux.routes[5].id=partner-swagger
spring.cloud.gateway.server.webflux.routes[5].uri=http://partner-service:8083
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/partner/v3/api-docs
spring.cloud.gateway.server.webflux.routes[5].filters[0]=RewritePath=/partner(?<segment>/?.*), $\{segment}

# ==========================
# Centralized Swagger UI Config
# ==========================

springdoc.swagger-ui.urls[0].name=Auth Service
springdoc.swagger-ui.urls[0].url=/auth/v3/api-docs

springdoc.swagger-ui.urls[1].name=Customer Service
springdoc.swagger-ui.urls[1].url=/customer/v3/api-docs

springdoc.swagger-ui.urls[2].name=Partner Service
springdoc.swagger-ui.urls[2].url=/partner/v3/api-docs

# ==========================
# Actuator
# ==========================

management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.gateway.enabled=true