server.port=8080
spring.application.name=api-gateway

# ==========================
# Gateway Routes (Business APIs)
# ==========================

spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=http://localhost:8081
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/auth/**

spring.cloud.gateway.routes[1].id=customer-service
spring.cloud.gateway.routes[1].uri=http://localhost:8082
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/customers/**

spring.cloud.gateway.routes[2].id=partner-service
spring.cloud.gateway.routes[2].uri=http://localhost:8083
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/v1/partners/**

spring.cloud.gateway.routes[3].id=bike-service
spring.cloud.gateway.routes[3].uri=http://localhost:8084
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/v1/bikes/**

# ==========================
# Swagger Routes (OpenAPI Specs)
# ==========================

# Auth Service API Docs
spring.cloud.gateway.routes[4].id=auth-swagger
spring.cloud.gateway.routes[4].uri=http://localhost:8081
spring.cloud.gateway.routes[4].predicates[0]=Path=/auth/v3/api-docs/**
spring.cloud.gateway.routes[4].filters[0]=RewritePath=/auth/(?<segment>.*), /${segment}

# Customer Service API Docs
spring.cloud.gateway.routes[5].id=customer-swagger
spring.cloud.gateway.routes[5].uri=http://localhost:8082
spring.cloud.gateway.routes[5].predicates[0]=Path=/customer/v3/api-docs/**
spring.cloud.gateway.routes[5].filters[0]=RewritePath=/customer/(?<segment>.*), /${segment}

# Partner Service API Docs
spring.cloud.gateway.routes[6].id=partner-swagger
spring.cloud.gateway.routes[6].uri=http://localhost:8083
spring.cloud.gateway.routes[6].predicates[0]=Path=/partner/v3/api-docs/**
spring.cloud.gateway.routes[6].filters[0]=RewritePath=/partner/(?<segment>.*), /${segment}

# Bike Service API Docs
spring.cloud.gateway.routes[7].id=bike-swagger
spring.cloud.gateway.routes[7].uri=http://localhost:8084
spring.cloud.gateway.routes[7].predicates[0]=Path=/bikes/v3/api-docs/**
spring.cloud.gateway.routes[7].filters[0]=RewritePath=/bikes/(?<segment>.*), /${segment}

# ==========================
# Centralized Swagger UI Config
# ==========================

springdoc.swagger-ui.urls[0].name=Auth Service
springdoc.swagger-ui.urls[0].url=/auth/v3/api-docs

springdoc.swagger-ui.urls[1].name=Customer Service
springdoc.swagger-ui.urls[1].url=/customer/v3/api-docs

springdoc.swagger-ui.urls[2].name=Partner Service
springdoc.swagger-ui.urls[2].url=/partner/v3/api-docs

springdoc.swagger-ui.urls[3].name=Bike Service
springdoc.swagger-ui.urls[3].url=/bikes/v3/api-docs

# ==========================
# Actuator
# ==========================

management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.gateway.enabled=true