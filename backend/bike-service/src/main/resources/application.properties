spring.application.name=bike-service

server.port=8084

spring.datasource.url=jdbc:postgresql://ep-jolly-hat-aw1e0g7w-pooler.c-12.us-east-1.aws.neon.tech/neondb?sslmode=require
spring.datasource.username=neondb_owner
spring.datasource.password=npg_YP28TBgenFaZ
spring.datasource.driver-class-name=org.postgresql.Driver

# Cap connections so microservices don't exhaust Neon limits
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000

# Tell Flyway to retry connecting to the DB instead of crashing immediately on startup
spring.flyway.connect-retries=10
spring.flyway.init-sqls=SELECT 1

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect


jwt.secret=mySuperSecretKeyForBikeRentalApplicationAuthentication123456789
jwt.expiration=86400000

