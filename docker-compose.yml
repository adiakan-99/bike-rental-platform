version: "3.8"

services:
  # ==========================================
  # Infrastructure Services
  # ==========================================
  minio:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    container_name: bike_rental_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  createbuckets:
    image: minio/mc
    container_name: bike_rental_minio_buckets
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadminpassword;
      /usr/bin/mc mb myminio/bike-rental-bucket;
      /usr/bin/mc anonymous set public myminio/bike-rental-bucket;
      exit 0;
      "

  # ==========================================
  # Microservices
  # ==========================================
  auth-service:
    build:
      context: ./backend/auth-service
    ports:
      - "8081:8081"

  customer-service:
    build:
      context: ./backend/customer-service
    ports:
      - "8082:8082"
    environment:
      - AUTH_SERVICE_URL=http://auth-service:8081

  partner-service:
    build:
      context: ./backend/partner-service
    ports:
      - "8083:8083"
    environment:
      - AUTH_SERVICE_URL=http://auth-service:8081

  bike-service:
    build:
      context: ./backend/bike-service
    ports:
      - "8084:8084"
    environment:
      - AUTH_SERVICE_URL=http://auth-service:8081

  api-gateway:
    build:
      context: ./backend/api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - auth-service
      - customer-service
      - partner-service
      - bike-service

volumes:
  minio_data:
