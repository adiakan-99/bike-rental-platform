# -----------------------------------------
# Anchors for Reusable Configuration
# -----------------------------------------
x-minio-env: &minio-env
  MINIO_URL: http://minio:9000
  MINIO_PUBLIC_URL: http://localhost:9000
  MINIO_ACCESS_KEY: admin
  MINIO_SECRET_KEY: password123

services:
  # -----------------------------------------
  # Infrastructure Services
  # -----------------------------------------
  minio:
    image: minio/minio
    container_name: minio
    ports:
      - "9000:9000" # API Port
      - "9001:9001" # Console UI Port
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - bike-rental-network

  createbuckets:
    image: minio/mc
    container_name: minio-create-bucket
    depends_on:
      - minio
    restart: "no"
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set myminio http://minio:9000 admin password123;
      mc mb myminio/bike-rental-bucket || true;
      exit 0;
      "
    networks:
      - bike-rental-network
  # -----------------------------------------
  # Spring Boot Microservices
  # -----------------------------------------
  auth-service:
    build:
      context: ./backend/auth-service
    container_name: auth-service
    ports:
      - "8081:8081"
    environment:
      - CUSTOMER_SERVICE_URL=http://customer-service:8082
    networks:
      - bike-rental-network

  customer-service:
    build:
      context: ./backend/customer-service
    container_name: customer-service
    ports:
      - "8082:8082"
    environment:
      <<: *minio-env
    networks:
      - bike-rental-network

  partner-service:
    build:
      context: ./backend/partner-service
    container_name: partner-service
    ports:
      - "8083:8083"
    environment:
      <<: *minio-env
      AUTH_SERVICE_URL: http://auth-service:8081
      MINIO_URL: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadminpassword
    depends_on:
      - auth-service
      - minio
    networks:
      - bike-rental-network

  bike-service:
    build:
      context: ./backend/bike-service
    container_name: bike-service
    ports:
      - "8084:8084"
    networks:
      - bike-rental-network

  admin-service:
    build:
      context: ./backend/admin-service
    container_name: admin-service
    ports:
      - "8086:8086"
    environment:
      <<: *minio-env
      CUSTOMER_SERVICE_URL: http://customer-service:8082
      AUTH_SERVICE_URL: http://auth-service:8081
    networks:
      - bike-rental-network

  # -----------------------------------------
  # .NET Microservice
  # -----------------------------------------
  booking-service:
    build:
      context: ./backend/booking-service
    container_name: booking-service
    ports:
      - "8085:8085"
    environment:
      - ASPNETCORE_URLS=http://+:8085
    networks:
      - bike-rental-network

  # -----------------------------------------
  # API Gateway (Orchestrator)
  # -----------------------------------------
  api-gateway:
    build:
      context: ./backend/api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - auth-service
      - customer-service
      - partner-service
      - bike-service
      - admin-service
      - booking-service
      - minio
    networks:
      - bike-rental-network

# -----------------------------------------
# Custom Network Definition
# -----------------------------------------
networks:
  bike-rental-network:
    driver: bridge
    name: bike-rental-network
volumes:
  minio_data:
    driver: local
