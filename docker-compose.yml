version: '3.8'

services:
  # Local Object Storage Service (S3 Compatible for heavy files)
  minio:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    container_name: bike_rental_minio
    ports:
      - "9000:9000"   # API Port (For Spring Boot / .NET & Direct React PUT Uploads)
      - "9001:9001"   # Web Dashboard Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  # Helper service to automatically create the bucket at startup
  createbuckets:
    image: minio/mc
    container_name: bike_rental_minio_buckets
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadminpassword;
      /usr/bin/mc mb myminio/bike-rental-bucket;
      /usr/bin/mc anonymous set public myminio/bike-rental-bucket;
      exit 0;
      "

volumes:
  minio_data: